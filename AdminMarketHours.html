<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Market Hours - Admin - Stock Training System</title>
    <link rel="stylesheet" href="AdminLayout.css">
    <link rel="stylesheet" href="AdminStyles.css">
</head>
<body>

    <!-- Website Banner -->
    <header>
        <h2>Stock Training System - Admin</h2>
        <nav>
            <a href="AdminStocks.html">Stocks</a> |
            <a href="AdminMarketHours.html" class="active-nav">Change Market Hours</a> |
            <a href="AdminMarketSchedule.html">Change Market Schedule</a>
        </nav>
    </header>

    <main>
        <!-- Page Title Box -->
        <div class="page-title">
            Change Market Hours
        </div>

        <!-- Container Box -->
        <div class="container-box admin-container">
            <p id="currentHoursText" style="margin-bottom: 15px; font-weight: bold;">Current market hours: loading...</p>
            <form id="marketHoursForm">
                <div class="form-group">
                    <label for="openingHour">Market Opening Hour (0-23):</label>
                    <select id="openingHour" required>
                        <option value="">Select opening hour</option>
                        <!-- JavaScript will populate hours 0 to 23 -->
                    </select>
                </div>
                <div class="form-group">
                    <label for="closingHour">Market Closing Hour (0-23):</label>
                    <select id="closingHour" required>
                        <option value="">Select closing hour</option>
                        <!-- JavaScript will populate hours 0 to 23 -->
                    </select>
                </div>
                <div class="form-action-group" style="display: flex; gap: 10px; margin-top: 10px;">
                    <button type="submit" class="action-btn">Update Hours</button>
                    <button type="button" class="cancel-btn" id="clearMarketHoursBtn">Clear</button>
                </div>
            </form>
            <!-- Dynamic message area for feedback -->
            <div id="marketHoursMessageArea" class="message-area"></div>
        </div>
    </main>

    <!-- Footer -->
	<footer style="text-align: center;">
		<p>Settings</p>
		<p><a href="index.html" style="text-decoration: none; color: inherit;">User</a></p>
		<p>Help</p>
	</footer>

    <!-- JavaScript: show the current hours (GET /api/market/status) and save new ones (POST /api/admin/market/hours) -->
    <script>
        const openingSelect = document.getElementById('openingHour');
        const closingSelect = document.getElementById('closingHour');

        // Populate hours 00:00 to 23:00
        for (let i = 0; i < 24; i++) {
            const hourFormatted = i < 10 ? `0${i}` : `${i}`;
            
            const openOption = document.createElement('option');
            openOption.value = i;
            openOption.textContent = `${hourFormatted}:00`;
            openingSelect.appendChild(openOption);

            const closeOption = document.createElement('option');
            closeOption.value = i;
            closeOption.textContent = `${hourFormatted}:00`;
            closingSelect.appendChild(closeOption);
        }

        const marketHoursForm = document.getElementById('marketHoursForm');
        const marketHoursMessageArea = document.getElementById('marketHoursMessageArea');

        function showMessage(text, type) {
            marketHoursMessageArea.textContent = text;
            marketHoursMessageArea.className = 'message-area ' + type;
        }

        // Show the hours that are saved now and pick them in the dropdowns
        async function loadCurrentHours() {
            const currentHoursText = document.getElementById('currentHoursText');
            try {
                const response = await fetch('/api/market/status');
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Failed to load market hours');
                currentHoursText.textContent =
                    `Current market hours: ${data.openingTime.slice(0, 5)} to ${data.closingTime.slice(0, 5)} (${data.timeZone}). ` +
                    `Market is ${data.open ? 'OPEN' : 'CLOSED'} right now.`;
                openingSelect.value = String(Number(data.openingTime.slice(0, 2)));
                closingSelect.value = String(Number(data.closingTime.slice(0, 2)));
            } catch (err) {
                currentHoursText.textContent = 'Current market hours: could not load';
            }
        }

        marketHoursForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const openHour = parseInt(openingSelect.value);
            const closeHour = parseInt(closingSelect.value);

            if (isNaN(openHour) || isNaN(closeHour)) {
                showMessage('Please select both opening and closing hours', 'error');
                return;
            }
            if (openHour >= closeHour) {
                showMessage('Opening hour must be earlier than closing hour', 'error');
                return;
            }

            const button = marketHoursForm.querySelector('.action-btn');
            button.disabled = true;
            try {
                const response = await fetch('/api/admin/market/hours', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ openingHour: openHour, closingHour: closeHour })
                });
                const data = await response.json();

                if (response.status === 401) {
                    showMessage('Please sign in as an admin first (Login page), then come back', 'error');
                    return;
                }
                if (!response.ok) {
                    showMessage(data.error || 'Market hours were not updated', 'error');
                    return;
                }
                showMessage(data.message || 'Market hours updated successfully', 'success');
                await loadCurrentHours();
            } catch (err) {
                showMessage('Could not reach the server. Is it running?', 'error');
            } finally {
                button.disabled = false;
            }
        });

        // Clear button
        document.getElementById('clearMarketHoursBtn').addEventListener('click', () => {
            marketHoursForm.reset();
            marketHoursMessageArea.className = 'message-area';
            marketHoursMessageArea.textContent = '';
        });

        loadCurrentHours();
    </script>

</body>
</html>
