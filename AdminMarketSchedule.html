<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Market Schedule - Admin - Stock Training System</title>
    <!-- Link to Admin CSS files -->
    <link rel="stylesheet" href="AdminLayout.css">
    <link rel="stylesheet" href="AdminStyles.css">
</head>
<body>

    <!-- Website Banner -->
    <header>
        <h2>Stock Training System - Admin</h2>
        <nav>
            <a href="AdminStocks.html">Stocks</a> |
            <a href="AdminMarketHours.html">Change Market Hours</a> |
            <a href="AdminMarketSchedule.html" class="active-nav">Change Market Schedule</a>
        </nav>
    </header>

    <main>
        <!-- Page Title Box -->
        <div class="page-title">
            Change Market Schedule
        </div>

        <!-- Container Box -->
        <div class="container-box admin-container" style="max-width: 550px;">
            
            <!-- Calendar Grid View -->
            <div class="calendar-container">
                <div class="calendar-header">
                    <button type="button" id="prevMonthBtn">&lt;</button>
                    <span id="calendarMonthYearDisplay">October 2026</span>
                    <button type="button" id="nextMonthBtn">&gt;</button>
                </div>

                <div class="calendar-grid">
                    <div class="calendar-day-label">Sun</div>
                    <div class="calendar-day-label">Mon</div>
                    <div class="calendar-day-label">Tue</div>
                    <div class="calendar-day-label">Wed</div>
                    <div class="calendar-day-label">Thu</div>
                    <div class="calendar-day-label">Fri</div>
                    <div class="calendar-day-label">Sat</div>
                    
                    <!-- Days dynamically generated by JS -->
                    <div id="calendarDaysGrid" style="display: contents;"></div>
                </div>
            </div>

            <!-- Schedule Controls Form -->
            <div class="schedule-controls">
                
                <!-- Selected Date Box -->
                <div class="date-display-box">
                    <div style="font-size: 0.85rem; color: #64748b; text-transform: uppercase; margin-bottom: 4px;">Selected Date</div>
                    <div id="selectedDateText" style="font-size: 1.1rem;">16 - October - 2026</div>
                </div>

                <form id="marketScheduleForm">
                    
                    <!-- Market Status Drawer Selection Box -->
                    <div class="form-group">
                        <label for="marketStatusSelect">Market Status:</label>
                        <select id="marketStatusSelect" required>
                            <option value="Open">Open</option>
                            <option value="Closed">Closed</option>
                        </select>
                    </div>

                    <!-- Conditional Closed Reason Selection Box -->
                    <div class="form-group" id="closureReasonGroup" style="display: none;">
                        <label for="closureReasonSelect">Closure Reason:</label>
                        <select id="closureReasonSelect">
                            <option value="Weekend">Weekend</option>
                            <option value="Holiday">Holiday</option>
                        </select>
                    </div>

                    <div class="form-action-group" style="display: flex; gap: 10px; margin-top: 20px;">
                        <button type="submit" class="action-btn">Save Schedule</button>
                        <button type="button" class="cancel-btn" id="clearScheduleBtn">Clear</button>
                    </div>
                </form>

                <!-- Dynamic feedback message -->
                <div id="scheduleMessageArea" class="message-area"></div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer style="text-align: center;">
		<p>Settings</p>
		<p><a href="index.html" style="text-decoration: none; color: inherit;">User</a></p>
		<p>Help</p>
	</footer>

    <!-- Interactive Calendar and Dynamic Drawer Logic -->
    <script>
        let currentMonth = 9; // October (0-indexed)
        let currentYear = 2026;
        let selectedDay = 16;

        const monthNames = ["January", "February", "March", "April", "May", "June", 
                            "July", "August", "September", "October", "November", "December"];

        const monthDisplay = document.getElementById('calendarMonthYearDisplay');
        const calendarGrid = document.getElementById('calendarDaysGrid');
        const selectedDateText = document.getElementById('selectedDateText');
        const statusSelect = document.getElementById('marketStatusSelect');
        const closureGroup = document.getElementById('closureReasonGroup');
        const closureSelect = document.getElementById('closureReasonSelect');
        const messageArea = document.getElementById('scheduleMessageArea');

        // Toggle closure reason drawer based on market status selection
        statusSelect.addEventListener('change', () => {
            if (statusSelect.value === 'Closed') {
                closureGroup.style.display = 'flex';
            } else {
                closureGroup.style.display = 'none';
            }
        });

        // Render Calendar Days
        function renderCalendar() {
            monthDisplay.textContent = `${monthNames[currentMonth]} ${currentYear}`;
            calendarGrid.innerHTML = '';

            const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
            const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

            // Padding days before the 1st
            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'calendar-day empty';
                calendarGrid.appendChild(emptyCell);
            }

            // Render day boxes
            for (let day = 1; day <= totalDays; day++) {
                const dayCell = document.createElement('div');
                dayCell.className = 'calendar-day';
                dayCell.textContent = day;

                // Highlight selected day
                if (day === selectedDay) {
                    dayCell.classList.add('selected');
                }

                // Day click listener
                dayCell.addEventListener('click', () => {
                    document.querySelectorAll('.calendar-day').forEach(el => el.classList.remove('selected'));
                    dayCell.classList.add('selected');
                    selectedDay = day;
                    updateDateDisplay();
                });

                calendarGrid.appendChild(dayCell);
            }
        }

        function updateDateDisplay() {
            const formattedDay = selectedDay < 10 ? `0${selectedDay}` : selectedDay;
            selectedDateText.textContent = `${formattedDay} - ${monthNames[currentMonth]} - ${currentYear}`;
        }

        // Month Navigation
        document.getElementById('prevMonthBtn').addEventListener('click', () => {
            currentMonth--;
            if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            selectedDay = 1;
            renderCalendar();
            updateDateDisplay();
        });

        document.getElementById('nextMonthBtn').addEventListener('click', () => {
            currentMonth++;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            }
            selectedDay = 1;
            renderCalendar();
            updateDateDisplay();
        });

        // Form Submission Validation
        document.getElementById('marketScheduleForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const status = statusSelect.value;
            const reason = closureSelect.value;

            if (status === 'Closed') {
                messageArea.textContent = `Schedule saved: Closed for ${reason} on ${selectedDateText.textContent}`;
            } else {
                messageArea.textContent = `Schedule saved: Market Open on ${selectedDateText.textContent}`;
            }
            messageArea.className = 'message-area success';
        });

        // Clear Form
        document.getElementById('clearScheduleBtn').addEventListener('click', () => {
            statusSelect.value = 'Open';
            closureGroup.style.display = 'none';
            messageArea.className = 'message-area';
            messageArea.textContent = '';
        });

        // Initial Render
        renderCalendar();
    </script>

</body>
</html>
