<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Market Schedule - Admin - Stock Training System</title>
    <!-- Link to Admin CSS files -->
    <link rel="stylesheet" href="AdminLayout.css">
    <link rel="stylesheet" href="AdminStyles.css">
</head>
<body>

    <!-- Website Banner -->
    <header>
        <h2>Stock Training System - Admin</h2>
        <nav>
            <a href="AdminStocks.html">Stocks</a> |
            <a href="AdminMarketHours.html">Change Market Hours</a> |
            <a href="AdminMarketSchedule.html" class="active-nav">Change Market Schedule</a>
        </nav>
    </header>

    <main>
        <!-- Page Title Box -->
        <div class="page-title">
            Change Market Schedule
        </div>

        <!-- Container Box -->
        <div class="container-box admin-container" style="max-width: 550px;">
            
            <!-- Calendar Grid View -->
            <div class="calendar-container">
                <div class="calendar-header">
                    <button type="button" id="prevMonthBtn">&lt;</button>
                    <span id="calendarMonthYearDisplay"></span>
                    <button type="button" id="nextMonthBtn">&gt;</button>
                </div>

                <div class="calendar-grid">
                    <div class="calendar-day-label">Sun</div>
                    <div class="calendar-day-label">Mon</div>
                    <div class="calendar-day-label">Tue</div>
                    <div class="calendar-day-label">Wed</div>
                    <div class="calendar-day-label">Thu</div>
                    <div class="calendar-day-label">Fri</div>
                    <div class="calendar-day-label">Sat</div>
                    
                    <!-- Days dynamically generated by JS -->
                    <div id="calendarDaysGrid" style="display: contents;"></div>
                </div>
                <p style="font-size: 0.8rem; margin-top: 10px; color: #cbd5e1; text-align: center;">Red days are closed. Weekends are closed unless you set them to Open.</p>
            </div>

            <!-- Schedule Controls Form -->
            <div class="schedule-controls">
                
                <!-- Selected Date Box -->
                <div class="date-display-box">
                    <div style="font-size: 0.85rem; color: #64748b; text-transform: uppercase; margin-bottom: 4px;">Selected Date</div>
                    <div id="selectedDateText" style="font-size: 1.1rem;"></div>
                    <div id="selectedDateStatus" style="font-size: 0.9rem; margin-top: 4px;"></div>
                </div>

                <form id="marketScheduleForm">
                    
                    <!-- Market Status Drawer Selection Box -->
                    <div class="form-group">
                        <label for="marketStatusSelect">Market Status:</label>
                        <select id="marketStatusSelect" required>
                            <option value="Open">Open</option>
                            <option value="Closed">Closed</option>
                        </select>
                    </div>

                    <!-- Conditional Closed Reason Selection Box -->
                    <div class="form-group" id="closureReasonGroup" style="display: none;">
                        <label for="closureReasonSelect">Closure Reason:</label>
                        <select id="closureReasonSelect" disabled title="Set from the date: Saturday and Sunday are Weekend, any other day is Holiday">
                            <option value="Weekend">Weekend</option>
                            <option value="Holiday">Holiday</option>
                        </select>
                    </div>

                    <div class="form-action-group" style="display: flex; gap: 10px; margin-top: 20px;">
                        <button type="submit" class="action-btn">Save Schedule</button>
                        <button type="button" class="cancel-btn" id="clearScheduleBtn">Clear</button>
                    </div>
                </form>

                <!-- Dynamic feedback message -->
                <div id="scheduleMessageArea" class="message-area"></div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer style="text-align: center;">
		<p>Settings</p>
		<p><a href="index.html" style="text-decoration: none; color: inherit;">User</a></p>
		<p>Help</p>
	</footer>

    <!-- Closed days on the calendar (set by JavaScript from the database) -->
    <style>
        .calendar-day.closed { background-color: #7f1d1d; border-color: #b91c1c; }
        .calendar-day.closed:hover { background-color: #991b1b; }
        .calendar-day.closed.selected { background-color: #2563eb; border-color: #fca5a5; box-shadow: inset 0 0 0 3px #b91c1c; }
    </style>

    <!-- Interactive Calendar: loads each month (GET /api/admin/market/schedule) and saves a day (POST /api/admin/market/schedule) -->
    <script>
        // Start on todays month and day
        const today = new Date();
        let currentMonth = today.getMonth();   // 0-indexed
        let currentYear = today.getFullYear();
        let selectedDay = today.getDate();

        const monthNames = ["January", "February", "March", "April", "May", "June", 
                            "July", "August", "September", "October", "November", "December"];

        const monthDisplay = document.getElementById('calendarMonthYearDisplay');
        const calendarGrid = document.getElementById('calendarDaysGrid');
        const selectedDateText = document.getElementById('selectedDateText');
        const selectedDateStatus = document.getElementById('selectedDateStatus');
        const statusSelect = document.getElementById('marketStatusSelect');
        const closureGroup = document.getElementById('closureReasonGroup');
        const closureSelect = document.getElementById('closureReasonSelect');
        const messageArea = document.getElementById('scheduleMessageArea');
        const scheduleForm = document.getElementById('marketScheduleForm');

        // The schedule for the month on screen, from the database: { '2026-11-26': { open, reason, changedByAdmin } }
        let schedule = {};

        const pad = (n) => (n < 10 ? `0${n}` : `${n}`);
        const dateKey = (day) => `${currentYear}-${pad(currentMonth + 1)}-${pad(day)}`;

        function showMessage(text, type) {
            messageArea.textContent = text;
            messageArea.className = 'message-area ' + type;
        }

        // The closure reason comes from the date, there is no column for it in the database
        function reasonFor(day) {
            const weekday = new Date(currentYear, currentMonth, day).getDay();
            return weekday === 0 || weekday === 6 ? 'Weekend' : 'Holiday';
        }

        function showClosureReason() {
            closureSelect.value = reasonFor(selectedDay);
            closureGroup.style.display = statusSelect.value === 'Closed' ? 'flex' : 'none';
        }

        // Toggle closure reason drawer based on market status selection
        statusSelect.addEventListener('change', showClosureReason);

        // Render Calendar Days
        function renderCalendar() {
            monthDisplay.textContent = `${monthNames[currentMonth]} ${currentYear}`;
            calendarGrid.innerHTML = '';

            const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
            const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();
            if (selectedDay > totalDays) selectedDay = totalDays;

            // Padding days before the 1st
            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'calendar-day empty';
                calendarGrid.appendChild(emptyCell);
            }

            // Render day boxes
            for (let day = 1; day <= totalDays; day++) {
                const dayCell = document.createElement('div');
                dayCell.className = 'calendar-day';
                dayCell.textContent = day;

                const saved = schedule[dateKey(day)];
                if (saved && !saved.open) {
                    dayCell.classList.add('closed');
                    dayCell.title = `Closed (${saved.reason})`;
                }

                // Highlight selected day
                if (day === selectedDay) {
                    dayCell.classList.add('selected');
                }

                // Day click listener
                dayCell.addEventListener('click', () => {
                    selectedDay = day;
                    messageArea.className = 'message-area';
                    messageArea.textContent = '';
                    renderCalendar();
                    updateDateDisplay();
                });

                calendarGrid.appendChild(dayCell);
            }
        }

        // Show the picked date and set the form to what is saved for that day
        function updateDateDisplay() {
            selectedDateText.textContent = `${pad(selectedDay)} - ${monthNames[currentMonth]} - ${currentYear}`;
            const saved = schedule[dateKey(selectedDay)];
            if (saved) {
                selectedDateStatus.textContent = saved.open ? 'Currently: Open' : `Currently: Closed (${saved.reason})`;
                statusSelect.value = saved.open ? 'Open' : 'Closed';
            } else {
                selectedDateStatus.textContent = '';
            }
            showClosureReason();
        }

        // Load the month on screen from the database, then draw it
        async function loadMonth() {
            schedule = {};
            try {
                const response = await fetch(`/api/admin/market/schedule?month=${currentYear}-${pad(currentMonth + 1)}`);
                const data = await response.json();
                if (response.status === 401) {
                    showMessage('Please sign in as an admin first (Login page), then come back', 'error');
                } else if (!response.ok) {
                    showMessage(data.error || 'Could not load the schedule', 'error');
                } else {
                    for (const day of data.days) schedule[day.date] = day;
                }
            } catch (err) {
                showMessage('Could not reach the server. Is it running?', 'error');
            }
            renderCalendar();
            updateDateDisplay();
        }

        // Month Navigation
        document.getElementById('prevMonthBtn').addEventListener('click', () => {
            currentMonth--;
            if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            selectedDay = 1;
            messageArea.className = 'message-area';
            loadMonth();
        });

        document.getElementById('nextMonthBtn').addEventListener('click', () => {
            currentMonth++;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            }
            selectedDay = 1;
            messageArea.className = 'message-area';
            loadMonth();
        });

        // Save the picked day as Open or Closed
        scheduleForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const button = scheduleForm.querySelector('.action-btn');
            button.disabled = true;
            try {
                const response = await fetch('/api/admin/market/schedule', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ date: dateKey(selectedDay), open: statusSelect.value === 'Open' })
                });
                const data = await response.json();

                if (response.status === 401) {
                    showMessage('Please sign in as an admin first (Login page), then come back', 'error');
                    return;
                }
                if (!response.ok) {
                    showMessage(data.error || 'Schedule was not saved', 'error');
                    return;
                }
                await loadMonth();
                if (data.open) {
                    showMessage(`Schedule saved: Market Open on ${selectedDateText.textContent}`, 'success');
                } else {
                    showMessage(`Schedule saved: Closed for ${data.reason} on ${selectedDateText.textContent}`, 'success');
                }
            } catch (err) {
                showMessage('Could not reach the server. Is it running?', 'error');
            } finally {
                button.disabled = false;
            }
        });

        // Clear Form: put the form back to what is saved for the picked day
        document.getElementById('clearScheduleBtn').addEventListener('click', () => {
            messageArea.className = 'message-area';
            messageArea.textContent = '';
            statusSelect.value = 'Open';
            updateDateDisplay();
        });

        // Initial Render
        loadMonth();
    </script>

</body>
</html>
