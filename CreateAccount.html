<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Stock Training System</title>
    <link rel="stylesheet" href="UserLayout.css">
    <link rel="stylesheet" href="UserStyles.css">
</head>
<body>

    <!-- Website Banner -->
    <header>
        <h2>Stock Training System</h2>
        <nav>
            <a href="index.html">Login</a> |
            <a href="CreateAccount.html" class="active-nav">Create Account</a> |
            <a href="BuySell.html">Buy/Sell</a> |
            <a href="DepositWithdraw.html">Deposit/Withdraw</a> |
            <a href="Portfolio.html">Portfolio</a> |
            <a href="History.html">Transaction History</a>
        </nav>
    </header>

    <main>
        <!-- Page Title Box -->
        <div class="page-title">
            Create User Account
        </div>

        <!-- Create Account Box -->
        <div class="container-box create-account-container">
            <fieldset class="create-account-fieldset" style="border: none; padding: 0; margin: 0;">
                <legend class="create-account-legend" style="font-weight: bold; margin-bottom: 20px; color: #0f172a;">Enter Account Information</legend>
                <form id="createAccountForm">
                    <div class="form-group">
                        <label for="firstName">First Name:</label>
                        <input type="text" id="firstName" placeholder="Fill-in" maxlength="50" required>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name:</label>
                        <input type="text" id="lastName" placeholder="Fill-in" maxlength="50" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address:</label>
                        <input type="email" id="email" placeholder="Fill-in" maxlength="255" autocomplete="username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password:</label>
                        <input type="password" id="password" placeholder="8+ characters with a letter, number, and symbol" minlength="8" autocomplete="new-password" required>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password:</label>
                        <input type="password" id="confirmPassword" placeholder="Fill-in" autocomplete="new-password" required>
                    </div>
                    <div class="form-group">
                        <label for="adminCode">Admin Password (optional):</label>
                        <input type="password" id="adminCode" placeholder="Leave blank for a regular account" autocomplete="off">
                    </div>
                    <div class="form-action" style="margin-top: 20px;">
                        <button type="submit" id="createAccountBtn">Complete Account Creation</button>
                    </div>
                </form>
                <!-- Dynamic message area for account creation feedback -->
                <div id="createAccountMessageArea" class="message-area"></div>
            </fieldset>
        </div>
    </main>

    <!-- Footer -->
    <footer style="text-align: center;">
		<p>Settings</p>
		<p><a href="AdminStocks.html" style="text-decoration: none; color: inherit;">Admin</a></p>
		<p>Help</p>
	</footer>

    <!-- JavaScript: send the new account to the API (POST /api/register) -->
    <script>
        const createAccountForm = document.getElementById('createAccountForm');
        const createAccountBtn = document.getElementById('createAccountBtn');
        const createAccountMessageArea = document.getElementById('createAccountMessageArea');

        function showCreateMessage(text, type) {
            createAccountMessageArea.textContent = text;
            createAccountMessageArea.className = 'message-area ' + type;
        }

        createAccountForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const adminCode = document.getElementById('adminCode').value;

            if (!firstName || !lastName || !email || !password || !confirmPassword) {
                showCreateMessage('Please fill in all fields', 'error');
                return;
            }
            if (password.length < 8) {
                showCreateMessage('Password must be at least 8 characters', 'error');
                return;
            }
            if (!/[A-Za-z]/.test(password) || !/\d/.test(password) || !/[^A-Za-z0-9]/.test(password)) {
                showCreateMessage('Password must include a letter, a number, and a special character', 'error');
                return;
            }
            if (password !== confirmPassword) {
                showCreateMessage('Passwords do not match', 'error');
                return;
            }

            const payload = { firstName, lastName, email, password };
            if (adminCode) payload.adminCode = adminCode;

            createAccountBtn.disabled = true;
            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();

                if (!response.ok) {
                    showCreateMessage(data.error || 'Account creation failed', 'error');
                    return;
                }

                showCreateMessage((data.message || 'Account created') + '. Taking you to the sign-in page...', 'success');
                createAccountForm.reset();
                setTimeout(() => { window.location.href = 'index.html'; }, 1500);
            } catch (err) {
                showCreateMessage('Could not reach the server. Is it running?', 'error');
            } finally {
                createAccountBtn.disabled = false;
            }
        });
    </script>

</body>
</html>
