<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Stock Training System</title>
    <link rel="stylesheet" href="UserLayout.css">
    <link rel="stylesheet" href="UserStyles.css">
</head>
<body>

    <!-- Website Banner -->
    <header>
        <h2>Stock Training System</h2>
        <nav>
            <a href="Login.html" class="active-nav">Login</a> |
            <a href="CreateAccount.html">Create Account</a> |
            <a href="BuySell.html">Buy/Sell</a> |
            <a href="DepositWithdraw.html">Deposit/Withdraw</a> |
            <a href="Portfolio.html">Portfolio</a> |
            <a href="History.html">Transaction History</a> 
        </nav>
    </header>

    <main>
        <!-- Page Title Box -->
        <div class="page-title">
            Sign In
        </div>

        <!-- Sign In Box -->
        <div class="container-box login-container">
            <fieldset class="login-fieldset">
                <legend class="login-legend">Enter Sign In Information</legend>
                <form id="signInForm">
                    <div class="form-group">
                        <label for="username">Username:</label>
                        <input type="text" id="username" placeholder="Fill-in" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password:</label>
                        <input type="password" id="password" placeholder="Fill-in" required>
                    </div>
                    <div class="form-action">
                        <button type="submit">Sign In</button>
                    </div>
                </form>
            </fieldset>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>Settings</p>
        <p>Help</p>
    </footer>
    
</body>
</html>
