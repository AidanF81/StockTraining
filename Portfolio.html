<!DOCTYPE html>
<html lang="en">
<head>
    <!-- meta tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Stock Training System</title>
    <!-- Link to CSS files -->
    <link rel="stylesheet" href="UserLayout.css">
    <link rel="stylesheet" href="UserStyles.css">
</head>
<body>

    <!-- Website Banner -->
    <header>
        <h2>Stock Training System</h2>
        <nav>
            <a href="index.html">Login</a> |
            <a href="CreateAccount.html">Create Account</a> |
            <a href="BuySell.html">Buy/Sell</a> |
            <a href="DepositWithdraw.html">Deposit/Withdraw</a> |
            <a href="Portfolio.html" class="active-nav">Portfolio</a> |
            <a href="History.html">Transaction History</a>
        </nav>
    </header>

    <main>
        <!-- Page Title Box -->
        <div class="page-title">
            User Portfolio
            <div id="signedInAs" style="font-size: 0.85rem; font-weight: normal; color: #64748b; margin-top: 4px;"></div>
        </div>

        <!-- Portfolio Container Box -->
        <div class="container-box trade-container">

            <!-- Stat Card Summaries -->
            <div class="stat-card-grid">
                <div class="stat-card">
                    <div class="stat-label">Current Cash</div>
                    <div class="stat-value" id="portfolioCash">$0.00</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total Stock Value</div>
                    <div class="stat-value" id="portfolioStockValue">$0.00</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total Portfolio Value</div>
                    <div class="stat-value" id="portfolioTotalValue">$0.00</div>
                </div>
            </div>

            <!-- Holdings Table -->
            <table class="trade-holdings-table" id="portfolioTable">
                <thead>
                    <tr>
                        <th>Stock Name</th>
                        <th>Shares</th>
                        <th>Market Price</th>
                        <th>Price Change</th>
                        <th>Total Value</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="5" class="table-empty-state">Loading portfolio...</td>
                    </tr>
                </tbody>
            </table>

            <div id="portfolioMessageArea" class="message-area"></div>

            <div style="margin-top: 20px; text-align: right;">
                <button type="button" id="signOutBtn">Sign Out</button>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer style="text-align: center;">
		<p>Settings</p>
		<p><a href="AdminStocks.html" style="text-decoration: none; color: inherit;">Admin</a></p>
		<p>Help</p>
	</footer>

    <!-- JavaScript: check sign-in (GET /api/me) and load holdings (GET /api/portfolio) -->
    <script>
        const money = (n) => '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

        function renderHoldings(holdings) {
            const tableBody = document.querySelector('#portfolioTable tbody');
            tableBody.innerHTML = '';

            if (!holdings || holdings.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="5" class="table-empty-state">
                            No stocks in your portfolio currently
                        </td>
                    </tr>
                `;
                return;
            }

            for (const h of holdings) {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td></td>
                    <td>${Number(h.SharesOwned).toLocaleString('en-US')}</td>
                    <td>${money(h.Price)}</td>
                    <td>--</td>
                    <td>${money(h.TotalValue)}</td>
                `;
                row.children[0].textContent = `${h.StockTicker} (${h.CompanyName})`;
                tableBody.appendChild(row);
            }
        }

        async function loadPortfolio() {
            const messageArea = document.getElementById('portfolioMessageArea');
            try {
                // 1. Who is signed in? If nobody, go to the sign-in page.
                const meResponse = await fetch('/api/me');
                if (meResponse.status === 401) {
                    window.location.href = 'index.html';
                    return;
                }
                const me = await meResponse.json();
                document.getElementById('signedInAs').textContent =
                    `Signed in as ${me.user.firstName} ${me.user.lastName} (${me.user.email})`;

                // 2. Load holdings and totals.
                const response = await fetch('/api/portfolio');
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Failed to load portfolio');

                document.getElementById('portfolioCash').textContent = money(data.cash);
                document.getElementById('portfolioStockValue').textContent = money(data.stockValue);
                document.getElementById('portfolioTotalValue').textContent = money(data.totalValue);
                renderHoldings(data.holdings);
            } catch (err) {
                renderHoldings([]);
                messageArea.textContent = err.message || 'Could not reach the server';
                messageArea.className = 'message-area error';
            }
        }

        document.getElementById('signOutBtn').addEventListener('click', async () => {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = 'index.html';
        });

        window.onload = loadPortfolio;
    </script>

</body>
</html>
