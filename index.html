<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Stock Training System</title>
    <link rel="stylesheet" href="UserLayout.css">
    <link rel="stylesheet" href="UserStyles.css">
</head>
<body>

    <!-- Website Banner -->
    <header>
        <h2>Stock Training System</h2>
        <nav>
            <a href="index.html" class="active-nav">Login</a> |
            <a href="CreateAccount.html">Create Account</a> |
            <a href="BuySell.html">Buy/Sell</a> |
            <a href="DepositWithdraw.html">Deposit/Withdraw</a> |
            <a href="Portfolio.html">Portfolio</a> |
            <a href="History.html">Transaction History</a>
        </nav>
    </header>

    <main>
        <!-- Page Title Box -->
        <div class="page-title">
            Sign In
        </div>

        <!-- Sign In Box -->
        <div class="container-box login-container">
            <fieldset class="login-fieldset">
                <legend class="login-legend">Enter Sign In Information</legend>
                <form id="signInForm">
                    <div class="form-group">
                        <label for="email">Email Address:</label>
                        <input type="email" id="email" placeholder="Fill-in" autocomplete="username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password:</label>
                        <input type="password" id="password" placeholder="Fill-in" autocomplete="current-password" required>
                    </div>
                    <div class="form-action">
                        <button type="submit" id="signInBtn">Sign In</button>
                    </div>
                </form>
                <!-- Dynamic message area for sign-in feedback -->
                <div id="signInMessageArea" class="message-area"></div>
            </fieldset>
        </div>
    </main>

    <!-- Footer -->
    <footer style="text-align: center;">
		<p>Settings</p>
		<p><a href="AdminStocks.html" style="text-decoration: none; color: inherit;">Admin</a></p>
		<p>Help</p>
	</footer>

    <!-- JavaScript: send the sign-in form to the API (POST /api/login) -->
    <script>
        const signInForm = document.getElementById('signInForm');
        const signInBtn = document.getElementById('signInBtn');
        const signInMessageArea = document.getElementById('signInMessageArea');

        function showSignInMessage(text, type) {
            signInMessageArea.textContent = text;
            signInMessageArea.className = 'message-area ' + type;
        }

        signInForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showSignInMessage('Enter your email and password', 'error');
                return;
            }

            signInBtn.disabled = true;
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();

                if (!response.ok) {
                    showSignInMessage(data.error || 'Sign in failed', 'error');
                    return;
                }

                // Admins go to the admin tools, everyone else to their portfolio.
                const destination = data.user.isAdmin ? 'AdminStocks.html' : 'Portfolio.html';
                const where = data.user.isAdmin ? 'admin tools' : 'your portfolio';
                showSignInMessage(`Welcome back, ${data.user.firstName}. Loading ${where}...`, 'success');
                setTimeout(() => { window.location.href = destination; }, 900);
            } catch (err) {
                showSignInMessage('Could not reach the server. Is it running?', 'error');
            } finally {
                signInBtn.disabled = false;
            }
        });
    </script>

</body>
</html>
